# CI for CraftCV-frontend, executed by the craftcv-frontend-ci CodeBuild
# project in eu-west-1. The project itself is defined in CraftCV-devops.
#
# This file defines no quality gates of its own. scripts/check.sh is already
# the canonical gate - the Git hooks call it and so does this - so a green
# local run and a green build mean the same thing.

version: 0.2

env:
  variables:
    # Keeps npm's cache inside the path declared under `cache` below.
    npm_config_cache: /root/.npm
    NODE_OPTIONS: --max-old-space-size=3072

phases:
  install:
    runtime-versions:
      # Matches .nvmrc.
      nodejs: 22
    commands:
      # --- Repository conventions -----------------------------------------
      # Runs first, before npm ci, because a badly named branch should cost
      # seconds rather than minutes.
      #
      # Pull requests only: develop and main are protected branches whose
      # history has already been through this check.
      - |
        case "${CODEBUILD_WEBHOOK_EVENT:-}" in
          PULL_REQUEST_*)
            BASE="${CODEBUILD_WEBHOOK_BASE_REF#refs/heads/}"
            HEAD_BRANCH="${CODEBUILD_WEBHOOK_HEAD_REF#refs/heads/}"
            echo "Checking conventions: ${HEAD_BRANCH} -> ${BASE}"

            sh scripts/validate-conventions.sh branch "$HEAD_BRANCH" || exit 1

            # No `git fetch`: CodeBuild discards its clone credentials, and a
            # full clone (git_clone_depth = 0) already has every remote ref.
            BASE_REF="origin/${BASE}"
            git rev-parse --verify --quiet "$BASE_REF" >/dev/null \
              || { echo "base ref ${BASE_REF} is not in the clone"; exit 1; }
            MERGE_BASE=$(git merge-base "$BASE_REF" HEAD)
            echo "Comparing ${MERGE_BASE}..HEAD"

            # Read from a file, not a pipe: a pipeline would put the loop in a
            # subshell and swallow the failing exit status.
            git log --format=%s "${MERGE_BASE}..HEAD" > /tmp/subjects
            while IFS= read -r subject; do
              [ -n "$subject" ] || continue
              sh scripts/validate-conventions.sh commit "$subject" || exit 1
            done < /tmp/subjects

            git diff --check "${MERGE_BASE}..HEAD" || { echo "whitespace errors above"; exit 1; }
            echo "Conventions OK"
            ;;
          *)
            echo "Not a pull request - skipping convention checks."
            ;;
        esac

      # npm ci, not npm install: it installs exactly the lockfile and fails if
      # package.json and package-lock.json disagree.
      - npm ci

  build:
    commands:
      # The same four gates the Git hooks run, in the same order.
      - sh scripts/check.sh lint
      - sh scripts/check.sh typecheck
      - sh scripts/check.sh test
      - sh scripts/check.sh build

# No reports: section. vitest is not configured to emit JUnit XML here; add a
# reporter and a reports block together if that becomes useful.

cache:
  paths:
    - /root/.npm/**/*
