name: Repository standards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  repository-standards:
    name: repository-standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: sh scripts/validate-conventions.sh branch "$BRANCH_NAME"

      - name: Validate commit subjects
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/validate-conventions.sh commit "$(git log -1 --format=%s "$HEAD_SHA")"

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA..$HEAD_SHA"
